name: Crawl Arc'teryx US catalog

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: Catalog source
        type: choice
        options: [all, leaf]
        default: all

permissions:
  contents: read

concurrency:
  group: rangeset-crawl-arcteryx
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run catalog crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRAWL_SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          mkdir -p .crawl
          set -o pipefail
          args=()
          if [ "$CRAWL_SOURCE" = leaf ]; then args+=(--leaf); fi
          pnpm crawl:arcteryx "${args[@]}" 2>&1 | tee .crawl/arcteryx.log
      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arcteryx-crawl-log
          path: .crawl/arcteryx.log
          retention-days: 30
